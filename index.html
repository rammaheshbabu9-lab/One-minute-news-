<!DOCTYPE html>

<title>One Minute News</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#000;
    color:#fff;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.app{
    width:100%;
    height:100vh;
    position:relative;
    background:#050505;
}

@media(min-width:700px){
    .app{
        width:480px;
        margin:auto;
        box-shadow:0 0 70px rgba(0,0,0,.7);
    }
}

/* ================= HEADER ================= */

.header{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:50;
    padding:12px 13px 9px;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.98),
        rgba(0,0,0,.88),
        rgba(0,0,0,.25),
        transparent
    );
}

.logo{
    font-size:17px;
    font-weight:1000;
    letter-spacing:-.5px;
}

.logo span{
    color:#ef4444;
}

.live{
    background:#dc2626;
    color:#fff;
    padding:4px 7px;
    border-radius:5px;
    font-size:8px;
    font-weight:900;
}

.mode-switch{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    border-radius:999px;
    padding:5px 9px;
    display:flex;
    gap:7px;
    font-size:10px;
    font-weight:800;
}

.mode-active{
    color:#ef4444;
}

.mode-inactive{
    color:#888;
}

.breaking{
    margin-top:9px;
    height:31px;
    border-radius:9px;
    background:rgba(127,29,29,.32);
    border:1px solid rgba(239,68,68,.25);
    display:flex;
    align-items:center;
    gap:7px;
    padding:0 9px;
}

.breaking-dot{
    width:7px;
    height:7px;
    background:#ef4444;
    border-radius:50%;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:.3}
}

.categories{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-top:8px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:none;
    border-radius:999px;
    padding:6px 11px;
    background:#181818;
    border:1px solid #292929;
    color:#999;
    font-size:9px;
    font-weight:800;
}

.category.active{
    background:#dc2626;
    border-color:#dc2626;
    color:#fff;
}

/* ================= NEWS SCREEN ================= */

.news-screen{
    height:100vh;
    overflow-y:auto;
    padding-top:143px;
    padding-bottom:82px;
    scrollbar-width:none;
}

.news-screen::-webkit-scrollbar{
    display:none;
}

.news-heading{
    padding:0 13px 10px;
}

.news-heading h1{
    font-size:20px;
    font-weight:1000;
    margin:0;
}

.news-heading p{
    color:#777;
    font-size:9px;
    margin:4px 0 0;
}

/* ================= NEWS CARD ================= */

.news-card{
    margin:0 12px 14px;
    border-radius:17px;
    overflow:hidden;
    background:#111;
    border:1px solid #222;
    box-shadow:0 5px 25px rgba(0,0,0,.35);
}

.news-photo-wrap{
    position:relative;
}

.news-photo{
    width:100%;
    height:205px;
    display:block;
    object-fit:cover;
    background:#222;
}

.news-tag{
    position:absolute;
    left:10px;
    top:10px;
    background:#dc2626;
    padding:5px 8px;
    border-radius:6px;
    font-size:8px;
    font-weight:900;
}

.news-read{
    position:absolute;
    right:10px;
    top:10px;
    width:37px;
    height:37px;
    border-radius:50%;
    background:rgba(0,0,0,.75);
    border:1px solid rgba(255,255,255,.2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
}

.news-body{
    padding:13px;
}

.news-title{
    font-size:18px;
    line-height:1.25;
    font-weight:950;
    margin:0;
}

.news-description{
    color:#a1a1aa;
    font-size:12px;
    line-height:1.5;
    margin:8px 0 0;
}

.news-meta{
    display:flex;
    gap:8px;
    align-items:center;
    color:#777;
    font-size:9px;
    margin-top:10px;
}

.news-source{
    margin-top:10px;
    display:flex;
    align-items:center;
    gap:7px;
}

.source-logo{
    width:27px;
    height:27px;
    border-radius:50%;
    background:#dc2626;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:8px;
    font-weight:1000;
}

.source-name{
    font-size:9px;
    font-weight:800;
    color:#999;
}

.news-actions{
    border-top:1px solid #222;
    margin-top:11px;
    padding-top:9px;
    display:flex;
    justify-content:space-between;
}

.news-action{
    color:#999;
    font-size:10px;
    display:flex;
    align-items:center;
    gap:3px;
}

.news-action:active{
    transform:scale(.92);
}

.liked{
    color:#ef4444;
}

/* ================= TRENDING ================= */

.trending{
    padding:0 12px 17px;
}

.trending-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:9px;
}

.trending-title{
    font-size:16px;
    font-weight:1000;
}

.trending-sub{
    font-size:9px;
    color:#777;
}

.trending-list{
    display:flex;
    overflow-x:auto;
    gap:9px;
    scrollbar-width:none;
}

.trending-list::-webkit-scrollbar{
    display:none;
}

.trend-card{
    min-width:240px;
    background:#151515;
    border:1px solid #292929;
    border-radius:14px;
    padding:11px;
}

.trend-number{
    width:26px;
    height:26px;
    border-radius:50%;
    background:#dc2626;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:1000;
}

.trend-text{
    margin-top:8px;
    font-size:12px;
    line-height:1.35;
    font-weight:850;
}

.trend-time{
    color:#666;
    font-size:8px;
    margin-top:7px;
}

/* ================= VIDEO REELS ================= */

.video-screen{
    height:100vh;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
}

.video-screen::-webkit-scrollbar{
    display:none;
}

.video-page{
    height:100vh;
    min-height:100vh;
    scroll-snap-align:start;
    position:relative;
    overflow:hidden;
    background:#000;
}

.video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
}

.video-gradient{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.65),
            transparent 30%,
            transparent 48%,
            rgba(0,0,0,.92)
        );
    pointer-events:none;
}

.video-info{
    position:absolute;
    left:13px;
    right:70px;
    bottom:90px;
    z-index:5;
}

.video-tag{
    display:inline-block;
    background:#dc2626;
    padding:5px 8px;
    border-radius:5px;
    font-size:8px;
    font-weight:900;
    margin-bottom:8px;
}

.video-title{
    font-size:20px;
    line-height:1.2;
    font-weight:1000;
}

.video-description{
    color:#ddd;
    font-size:11px;
    line-height:1.45;
    margin-top:7px;
}

.video-side{
    position:absolute;
    right:9px;
    bottom:88px;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:13px;
}

.video-button{
    display:flex;
    flex-direction:column;
    align-items:center;
    color:#fff;
    font-size:8px;
    font-weight:800;
}

.video-circle{
    width:43px;
    height:43px;
    border-radius:50%;
    background:rgba(0,0,0,.62);
    border:1px solid rgba(255,255,255,.16);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    margin-bottom:3px;
}

.video-progress{
    position:absolute;
    left:0;
    right:0;
    bottom:71px;
    height:2px;
    background:rgba(255,255,255,.2);
    z-index:20;
}

.video-progress-bar{
    height:100%;
    width:0;
    background:#fff;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:60;
    height:68px;
    background:rgba(0,0,0,.94);
    backdrop-filter:blur(18px);
    border-top:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:space-around;
}

.nav-button{
    color:#777;
    font-size:8px;
    font-weight:800;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
}

.nav-button span{
    font-size:19px;
}

.nav-button.active{
    color:#ef4444;
}

/* ================= MODALS ================= */

.modal{
    position:absolute;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.96);
    padding:14px;
}

.search-input{
    width:100%;
    background:#151515;
    border:1px solid #333;
    border-radius:13px;
    padding:12px 14px;
    color:#fff;
    outline:none;
    font-size:13px;
}

.search-result{
    background:#121212;
    border:1px solid #292929;
    border-radius:13px;
    padding:12px;
    margin-top:8px;
    text-align:left;
    width:100%;
}

.comments-panel{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:120;
    background:#0d0d0d;
    border-top:1px solid #333;
    border-radius:25px 25px 0 0;
    transform:translateY(100%);
    transition:.3s;
}

.comments-panel.open{
    transform:translateY(0);
}

.comment-list{
    max-height:280px;
    overflow-y:auto;
    padding:13px;
}

.share-modal{
    position:absolute;
    inset:0;
    z-index:130;
    background:rgba(0,0,0,.75);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.share-box{
    width:100%;
    max-width:380px;
    background:#111;
    border:1px solid #333;
    border-radius:24px;
    padding:20px;
}

/* ================= UTIL ================= */

.hidden{
    display:none !important;
}

@keyframes heartPop{
    0%{
        transform:scale(.2);
        opacity:0;
    }
    30%{
        transform:scale(1.3);
        opacity:1;
    }
    100%{
        transform:scale(1);
        opacity:0;
    }
}

.heart-pop{
    animation:heartPop .8s forwards;
}
</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="flex items-center justify-between">

        <div class="flex items-center gap-2">

            <span class="live">LIVE</span>

            <div class="logo">
                ONE<span>MINUTE</span> NEWS
            </div>

        </div>

        <div class="flex items-center gap-2">

            <div class="mode-switch">

                    id="newsTab"

                    News
                </button>

                <span class="text-zinc-600">|</span>

                <button
                    id="videoTab"
                    class="mode-inactive"
                    onclick="showVideos()">
                    Videos
                </button>

            </div>

            <button
                onclick="openSearch()"
                class="w-8 h-8 rounded-full bg-zinc-900 border border-zinc-800">
                🔍
            </button>

        </div>

    </div>

    <div class="breaking">

        <span class="breaking-dot"></span>

        <b class="text-red-400 text-[8px]">
            BREAKING
        </b>

        <span
            id="breakingText"
            class="text-[9px] text-zinc-300 truncate">
            Latest breaking news updates...
        </span>

    </div>

    <div class="categories">

        <button data-category="all"
            class="category active"
            onclick="setCategory('all')">
            All
        </button>

        <button data-category="business"
            class="category"
            onclick="setCategory('business')">
            💼 Business
        </button>

        <button data-category="sports"
            class="category"
            onclick="setCategory('sports')">
            🏆 Sports
        </button>

        <button data-category="cinema"
            class="category"
            onclick="setCategory('cinema')">
            🎬 Cinema
        </button>

        <button data-category="tech"
            class="category"
            onclick="setCategory('tech')">
            💻 Tech
        </button>

        <button data-category="politics"
            class="category"
            onclick="setCategory('politics')">
            🏛️ Politics
        </button>

    </div>

</header>


<!-- NEWS -->

<main id="newsScreen" class="news-screen">
    <div id="newsContainer"></div>
</main>


<!-- VIDEOS -->

<main id="videoScreen" class="video-screen hidden">
    <div id="videoContainer"></div>
</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <button id="feedNav"
        class="nav-button active"
        onclick="goFeed()">
        <span>⚡</span>
        Feed
    </button>

    <button id="exploreNav"
        class="nav-button"
        onclick="goVideos()">
        <span>▶️</span>
        Videos
    </button>

    <button id="trendingNav"
        class="nav-button"
        onclick="goTrending()">
        <span>🔥</span>
        Trending
    </button>

    <button id="savedNav"
        class="nav-button"
        onclick="showSaved()">
        <span>🔖</span>
        Saved
    </button>

</nav>


<!-- SEARCH -->

<div id="searchModal" class="modal hidden">

    <div class="flex gap-2">

        <input
            id="searchInput"
            class="search-input"
            placeholder="Search news..."
            oninput="searchNews(this.value)">

        <button
            onclick="closeSearch()"
            class="w-12 rounded-xl bg-zinc-900 border border-zinc-800">
            ✕
        </button>

    </div>

    <div id="searchResults"></div>

</div>


<!-- COMMENTS -->

<div id="commentsPanel" class="comments-panel">

    <div class="p-4 border-b border-zinc-800 flex justify-between">

        <b>Comments</b>

        <button onclick="closeComments()">
            ✕
        </button>

    </div>

    <div id="commentList" class="comment-list">
        <div class="text-center text-zinc-600 text-xs">
            Loading comments...
        </div>
    </div>

    <div class="p-3 border-t border-zinc-800 flex gap-2">

        <input
            id="commentInput"
            class="flex-1 bg-zinc-900 rounded-full px-4 py-2 text-xs outline-none"
            placeholder="Write a comment...">

        <button
            onclick="postComment()"
            class="bg-red-600 rounded-full px-4 text-xs font-bold">
            Post
        </button>

    </div>

</div>


<!-- SHARE -->

<div id="shareModal" class="share-modal hidden">

    <div class="share-box">

        <div class="flex justify-between mb-6">

            <b>Share News</b>

            <button onclick="closeShare()">
                ✕
            </button>

        </div>

        <div class="grid grid-cols-4 gap-4 text-center text-[9px]">

            <button onclick="shareWhatsApp()">
                <div class="w-12 h-12 mx-auto rounded-full bg-green-600 flex items-center justify-center text-xl">
                    💬
                </div>
                <div class="mt-2">WhatsApp</div>
            </button>

            <button onclick="shareTelegram()">
                <div class="w-12 h-12 mx-auto rounded-full bg-blue-500 flex items-center justify-center text-xl">
                    ✈️
                </div>
                <div class="mt-2">Telegram</div>
            </button>

            <button onclick="copyShare()">
                <div class="w-12 h-12 mx-auto rounded-full bg-zinc-700 flex items-center justify-center text-xl">
                    🔗
                </div>
                <div class="mt-2">Copy</div>
            </button>

            <button onclick="nativeShare()">
                <div class="w-12 h-12 mx-auto rounded-full bg-purple-600 flex items-center justify-center text-xl">
                    📤
                </div>
                <div class="mt-2">More</div>
            </button>

        </div>

    </div>

</div>

            .from("news")

            .order("published_at",{ascending:false});

        if(data && data.length){

            newsData=data.map(item=>({

                id:item.id,

                category:item.category || "all",

                tag:item.tag || "NEWS",

                time:formatTime(item.published_at),

                title:item.title || "",

                description:item.description || "",

                image:item.image_url || "",

                views:Number(item.views || 0),

                likes:Number(item.likes || 0),

                shares:Number(item.shares || 0),

                source:item.source || "One Minute News"

            }));

        }else{

            newsData=[...fallbackNewsData];

        }

    }catch(error){

        console.error(error);

        newsData=[...fallbackNewsData];

    }

}

/* =====================================================
   NEWS VIEW TRACKING
===================================================== */

let newsViewObserver=null;

function setupNewsViewObserver(){

    if(newsViewObserver){
        newsViewObserver.disconnect();
    }

    newsViewObserver=
        new IntersectionObserver(
            entries=>{

                entries.forEach(entry=>{

                    if(
                        entry.isIntersecting &&
                        entry.intersectionRatio>=.65
                    ){

                        const id=
                            entry.target
                                .getAttribute(
                                    "data-news-id"
                                );

                        if(id){

                            incrementNewsView(id);

                        }

                    }

                });

            },
            {
                threshold:[.65]
            }
        );


    document
        .querySelectorAll(".news-card")
        .forEach(card=>{
            newsViewObserver.observe(card);
        });

}


/* =====================================================
   INCREMENT NEWS VIEW
===================================================== */

async function incrementNewsView(id){

    if(
        viewedNews.includes(String(id))
    ){
        return;
    }

    viewedNews.push(String(id));

    localStorage.setItem(
        "oneMinuteViewedNews",
        JSON.stringify(viewedNews)
    );


    const item=
        newsData.find(
            x=>String(x.id)===String(id)
        );

    if(item){

        item.views=
            Number(item.views || 0)+1;

        const visibleCard=
            document.getElementById(
                "news-"+CSS.escape(String(id))
            );

        if(visibleCard){

            const meta=
                visibleCard.querySelector(
                    ".news-meta"
                );

            if(meta){

                const firstSpan=
                    meta.querySelector("span");

                if(firstSpan){

                    firstSpan.innerHTML=
                        "👁️ "+
                        formatNumber(item.views);

                }

            }

        }

    }


    if(isUUID(id)){

        try{

            const {error}=
                await supabaseClient.rpc(
                    "increment_news_views",
                    {
                        p_news_id:id
                    }
                );

            if(error){
                console.error(
                    "View RPC error:",
                    error
                );
            }

        }catch(error){

            console.error(error);

        }

    }

}

/* =====================================================
   VIDEO OBSERVER
===================================================== */

let videoObserver=null;

function setupVideoObserver(){

    if(videoObserver){
        videoObserver.disconnect();
    }

    videoObserver=
        new IntersectionObserver(
            entries=>{

                entries.forEach(entry=>{

                    const video=
                        entry.target.querySelector(
                            "video"
                        );

                    if(!video)return;

                    if(entry.isIntersecting){

                        video.muted=muted;

                        video.play().catch(()=>{});

                    }else{

                        video.pause();

                    }

                });

            },
            {
                threshold:.65
            }
        );


    document
        .querySelectorAll(".video-page")
        .forEach(page=>
            videoObserver.observe(page)
        );


    document
        .querySelectorAll(".video")
        .forEach(video=>{

            video.addEventListener(
                "timeupdate",
                ()=>{

                    const id=
                        video.id.replace(
                            "video-",
                            ""
                        );

                    const bar=
                        document.getElementById(
                            "progress-"+id
                        );

                    if(
                        bar &&
                        video.duration &&
                        Number.isFinite(video.duration)
                    ){

                        bar.style.width=
                            (
                                video.currentTime /
                                video.duration *
                                100
                            )+"%";

                    }

                }
            );

        });

}

/* =====================================================
   LIKE NEWS
===================================================== */

async function likeNews(id){

    const item=
        newsData.find(
            x=>String(x.id)===String(id)
        );

    if(!item)return;

    const newState=
        !likedNews[id];

    likedNews[id]=newState;

    localStorage.setItem(
        "oneMinuteLikedNews",
        JSON.stringify(likedNews)
    );


    item.likes=
        Math.max(
            0,
            Number(item.likes || 0)
            +(newState?1:-1)
        );


    renderNews();


    if(isUUID(id)){

        try{

            const {error}=
                await supabaseClient.rpc(
                    "increment_news_likes",
                    {
                        p_news_id:id,
                        p_delta:newState?1:-1
                    }
                );

            if(error){

                console.error(
                    "Like RPC error:",
                    error
                );

            }

        }catch(error){

            console.error(error);

        }

    }

}

/* =====================================================
   NEWS VOICE
===================================================== */

function speakNews(id){

    const item=
        newsData.find(
            x=>String(x.id)===String(id)
        );

    if(!item)return;


    if(!("speechSynthesis" in window)){

        alert(
            "Voice is not supported on this device/browser."
        );

        return;

    }


    speechSynthesis.cancel();


    const text=
        item.tag+
        ". "+
        item.title+
        ". "+
        item.description;


    const speech=
        new SpeechSynthesisUtterance(text);

    speech.lang="en-IN";
    speech.rate=.92;
    speech.pitch=1;


    const voices=
        speechSynthesis.getVoices();

    const indianVoice=
        voices.find(
            voice=>
                voice.lang &&
                voice.lang
                    .toLowerCase()
                    .includes("en-in")
        );

    if(indianVoice){
        speech.voice=indianVoice;
    }


    speechSynthesis.speak(speech);

}

    list.innerHTML=`

        <div class="text-center
        text-zinc-600 text-xs">
            Loading comments...
        </div>

    `;


    try{

        let query=
            supabaseClient
                .from("comments")
                .select(
                    "id,user_name,text,created_at"
                )
                .eq("approved",true)
                .order(
                    "created_at",
                    {ascending:true}
                )
                .limit(100);


        if(currentCommentNewsId){

            query=
                query.eq(
                    "news_id",
                    currentCommentNewsId
                );

        }else if(currentCommentVideoId){

            query=
                query.eq(
                    "video_id",
                    currentCommentVideoId
                );

        }else{

            list.innerHTML=`
                <div class="text-center
                text-zinc-600 text-xs">
                    Select a news item first.
                </div>
            `;

            return;

        }


        const {data,error}=
            await query;


        if(error){

            console.error(
                "Comments load error:",
                error
            );

            list.innerHTML=`
                <div class="text-center
                text-zinc-600 text-xs">
                    Comments unavailable.
                </div>
            `;

            return;

        }


        if(!data || !data.length){

            list.innerHTML=`
                <div class="text-center
                text-zinc-600 text-xs py-8">
                    No approved comments yet.
                </div>
            `;

            return;

        }


        list.innerHTML=
            data.map(comment=>`

                <div class="flex gap-2 mb-4">

                    <div class="w-8 h-8 rounded-full
                    bg-red-600 flex items-center
                    justify-center text-xs font-bold">
                        ${escapeHTML(
                            (
                                comment.user_name ||
                                "A"
                            )
                            .charAt(0)
                            .toUpperCase()
                        )}
                    </div>

                    <div>

                        <b class="text-xs">
                            ${escapeHTML(
                                comment.user_name ||
                                "Anonymous"
                            )}
                        </b>

                        <p class="text-[10px]
                        text-zinc-500">
                            ${escapeHTML(
                                comment.text
                            )}
                        </p>

                    </div>

                </div>

            `).join("");


    }catch(error){

        console.error(error);

        list.innerHTML=`
            <div class="text-center
            text-zinc-600 text-xs">
                Comments unavailable.
            </div>
        `;

    }

}


/* =====================================================
   POST COMMENT
===================================================== */

async function postComment(){

    const input=
        document.getElementById(
            "commentInput"
        );

    const text=
        input.value.trim();

    if(!text)return;


    if(
        !currentCommentNewsId &&
        !currentCommentVideoId
    ){

        alert(
            "Please open comments from a news or video."
        );

        return;

    }


    const button=
        document.querySelector(
            "#commentsPanel button.bg-red-600"
        );


    if(button){

        button.disabled=true;
        button.innerText="...";

    }


    try{

        const payload={

            news_id:
                currentCommentNewsId,

            video_id:
                currentCommentVideoId,

            user_name:
                "You",

            text:text,

            approved:false

        };


        const {error}=
            await supabaseClient
                .from("comments")
                .insert([payload]);


        if(error){

            console.error(
                "Comment insert error:",
                error
            );

            alert(
                "Unable to post comment. Please try again."
            );

            return;

        }


        input.value="";


        alert(
            "Comment submitted for approval."
        );


        await loadComments();


    }catch(error){

        console.error(error);

        alert(
            "Unable to post comment."
        );

    }finally{

        if(button){

            button.disabled=false;
            button.innerText="Post";

        }

    }

}

async function copyShare(){

    await registerShare();

    const text=
        location.href+
        " — "+
        shareTitle;


    if(navigator.clipboard){

        try{

            await navigator.clipboard.writeText(text);

            alert("Link copied!");

        }catch(error){

            fallbackCopy(text);

        }

    }else{

        fallbackCopy(text);

    }

}


async function nativeShare(){

    await registerShare();

    if(navigator.share){

        try{

            await navigator.share({

                title:"One Minute News",

                text:shareTitle,

                url:location.href

            });

        }catch(e){}

    }else{

        copyShare();

    }

}


/* =====================================================
   REGISTER SHARE
===================================================== */

async function registerShare(){

    const id=currentShareNewsId;

    if(!id)return;

    const item=
        newsData.find(
            x=>String(x.id)===String(id)
        );

    if(item){

        item.shares=
            Number(item.shares || 0)+1;

    }


    if(isUUID(id)){

        try{

            const {error}=
                await supabaseClient.rpc(
                    "increment_news_shares",
                    {
                        p_news_id:id
                    }
                );

            if(error){

                console.error(
                    "Share RPC error:",
                    error
                );

            }

        }catch(error){

            console.error(error);

        }

    }

}


function fallbackCopy(text){

    const textarea=
        document.createElement("textarea");

    textarea.value=text;

    textarea.style.position="fixed";
    textarea.style.opacity="0";

    document.body.appendChild(
        textarea
    );

    textarea.select();

    try{

        document.execCommand("copy");

        alert("Link copied!");

    }catch(error){

        alert(
            "Copy is not supported."
        );

    }

    textarea.remove();

}

/* =====================================================
   HELPERS
===================================================== */

function formatNumber(number){

    number=Number(number || 0);


    if(number>=1000000){

        return (
            number/1000000
        ).toFixed(1)+"M";

    }


    if(number>=1000){

        return (
            number/1000
        ).toFixed(1)+"K";

    }


    return number;

}


function formatTime(dateValue){

    if(!dateValue){
        return "Just now";
    }


    const date=
        new Date(dateValue);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Just now";

    }


    const diff=
        Date.now()-
        date.getTime();


    const seconds=
        Math.floor(
            diff/1000
        );


    if(seconds<60){

        return "Just now";

    }


    const minutes=
        Math.floor(
            seconds/60
        );


    if(minutes<60){

        return minutes+
            " mins ago";

    }


    const hours=
        Math.floor(
            minutes/60
        );


    if(hours<24){

        return hours+
            " hours ago";

    }


    const days=
        Math.floor(
            hours/24
        );


    if(days<7){

        return days+
            " days ago";

    }


    return date.toLocaleDateString();

}


function isUUID(value){

    if(!value)return false;

    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
        .test(String(value));

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}
